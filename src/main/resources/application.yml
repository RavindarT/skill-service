server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: skill-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/skills_db}
    username: ${DB_USER:appuser}
    password: ${DB_PASSWORD:localdevonly}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
